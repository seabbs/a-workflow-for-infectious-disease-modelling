name: Build and Deploy Paper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile main paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: >-
            -pdf
            -interaction=nonstopmode
            -file-line-error

      - name: Compile supplementary
        uses: xu-cheng/latex-action@v3
        with:
          root_file: supplementary.tex
          args: >-
            -pdf
            -interaction=nonstopmode
            -file-line-error

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs-${{ github.sha }}
          path: |
            main.pdf
            supplementary.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Render README as landing page
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          cat > /tmp/style.css <<'CSSEOF'
          body {
            font-family: -apple-system, BlinkMacSystemFont,
              "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
            color: #24292e;
          }
          img { max-width: 100%; height: auto; }
          a { color: #0366d6; }
          pre {
            background: #f6f8fa;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
          }
          code {
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 85%;
          }
          pre code { background: none; padding: 0; }
          blockquote {
            border-left: 4px solid #dfe2e5;
            margin: 0;
            padding: 0 1rem;
            color: #6a737d;
          }
          CSSEOF
          pandoc README.md \
            --standalone \
            --metadata title="" \
            --css style.css \
            -o README.html

      - name: Prepare site directory
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp main.pdf _site/paper.pdf
          cp supplementary.pdf _site/supplementary.pdf
          cp README.html _site/index.html
          cp /tmp/style.css _site/style.css
          cp -r figures _site/figures

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
